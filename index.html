<head>

<title>Speak Up — Luyện nói tiếng Anh cùng AI</title>

     Chỉ dùng MÃ học viên. Ghi âm gửi về Google Drive của giáo viên (qua Google Apps Script), không gửi nơi khác.
     Nhận dạng giọng nói dùng dịch vụ có sẵn của trình duyệt (Chrome/Safari). -->
<style>
:root{
  --nen1:#0a1530; --nen2:#142a55; --kinh:rgba(255,255,255,.08); --vien:rgba(255,255,255,.14);
  --chu:#eef3ff; --chu2:#a9b8da; --chinh:#4f8cff; --nhan:#ff9f43; --nhan2:#b36bff;
  --dung:#2ecc71; --sai:#ff6b6b; --vang:#ffd166; --mau:#4f8cff; --hv:#ff9f43;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--chu);
  background:radial-gradient(900px 500px at 10% -10%,rgba(79,140,255,.35),transparent 60%),
             radial-gradient(700px 500px at 110% 30%,rgba(179,107,255,.25),transparent 60%),
             linear-gradient(160deg,var(--nen1),var(--nen2));background-attachment:fixed;min-height:100%}
#khung{max-width:480px;margin:0 auto;padding:14px 14px 90px;min-height:100vh;position:relative}
.dau{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:900;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,#7fb2ff,#ffd166,#ff9f43);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:11px;letter-spacing:.3px;font-weight:600;color:var(--chu2);-webkit-text-fill-color:var(--chu2)}
.the{background:var(--kinh);border:1px solid var(--vien);border-radius:20px;padding:16px;margin:12px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.nut{appearance:none;border:0;border-radius:14px;min-height:48px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;
  color:#fff;background:linear-gradient(135deg,#4f8cff,#3a63d8);box-shadow:0 6px 16px rgba(79,140,255,.35);cursor:pointer;transition:.15s}
.nut:active{transform:translateY(2px) scale(.98)} .nut:hover{transform:translateY(-2px)}
.nut.cam{background:linear-gradient(135deg,#ffb347,#ff7a3d);box-shadow:0 6px 16px rgba(255,122,61,.35)}
.nut.xanh{background:linear-gradient(135deg,#34d399,#16a34a)}
.nut.phu{background:transparent;border:1.5px solid var(--vien);box-shadow:none;color:var(--chu)}
.nut.nho{min-height:40px;padding:8px 12px;font-size:14px}
.hang{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hang>.nut{flex:1}
input,select{font:inherit;font-size:18px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--vien);
  background:rgba(255,255,255,.07);color:var(--chu);outline:none}
input:focus{border-color:var(--chinh)}
h1{font-size:24px;margin:6px 0} h2{font-size:19px;margin:4px 0 8px} p{line-height:1.5}
.mo{color:var(--chu2);font-size:14px}
.ban-nhap{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:11.5px;color:#cfe0ff;background:rgba(10,21,48,.92);
  padding:6px 8px;border-top:1px solid var(--vien);z-index:20}
.du-lieu-thu{background:repeating-linear-gradient(45deg,#ffd166,#ffd166 10px,#ffbf3c 10px,#ffbf3c 20px);color:#3b2a00;font-weight:800;
  text-align:center;border-radius:10px;padding:4px;font-size:12px;margin-bottom:8px}
.vao{animation:vao .3s ease} @keyframes vao{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.noi{animation:noi 3.2s ease-in-out infinite} @keyframes noi{50%{transform:translateY(-6px)}}
.luoi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chude{position:relative;border-radius:20px;padding:14px 12px 12px;min-height:150px;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--vien);transition:.15s}
.chude:hover{transform:translateY(-3px)} .chude:active{transform:scale(.98)}
.chude svg.icon{width:64px;height:64px;display:block;margin:0 auto 6px}
.chude b{display:block;text-align:center;font-size:15px} .chude i{display:block;text-align:center;font-style:normal;font-size:12px;color:var(--chu2)}
.chude .vach{position:absolute;inset:0 0 auto 0;height:5px}
.cham4{display:flex;justify-content:center;gap:5px;margin-top:8px}
.cham4 span{width:22px;height:6px;border-radius:4px;background:rgba(255,255,255,.18)} .cham4 span.x{background:var(--dung)}
.huy{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-weight:700;font-size:13px;
  background:rgba(255,255,255,.1);border:1px solid var(--vien)}
.chip{display:inline-block;padding:6px 11px;margin:3px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid var(--vien);transition:.25s}
.chip.sang{background:rgba(46,204,113,.25);border-color:var(--dung);color:#c9ffe0;transform:scale(1.06)}
.cau-lon{font-size:26px;font-weight:800;line-height:1.35;text-align:center;margin:8px 0}
.dich{color:var(--chu2);text-align:center;font-size:15px}
.am-tiet{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.tu-ta{display:inline-flex;align-items:flex-end;gap:3px;margin:0 8px}
.at{display:inline-block;border-radius:999px;background:rgba(127,178,255,.25);color:#dfe9ff;font-weight:700;padding:3px 8px;font-size:13px}
.at.nhan{background:linear-gradient(135deg,#ffb347,#ff7a3d);color:#fff;font-size:17px;padding:5px 11px;box-shadow:0 4px 10px rgba(255,122,61,.4)}
.mic{width:116px;height:116px;border-radius:50%;border:0;margin:6px auto;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ff9a6b,#ff4d6d);box-shadow:0 10px 30px rgba(255,77,109,.45),0 0 0 0 rgba(255,77,109,.5);transition:.2s}
.mic.dang{animation:mach 1.1s infinite} @keyframes mach{0%{box-shadow:0 0 0 0 rgba(255,77,109,.55)}100%{box-shadow:0 0 0 26px rgba(255,77,109,0)}}
.mic svg{width:52px;height:52px}
.giua{text-align:center}
canvas.song{width:100%;height:70px;display:block}
canvas.cao-do{width:100%;height:150px;display:block;border-radius:14px;background:rgba(0,0,0,.18)}
.tu{display:inline-block;padding:3px 7px;margin:2px;border-radius:8px;font-weight:700;font-size:19px}
.tu.d{background:rgba(46,204,113,.22);color:#b9ffd6} .tu.s{background:rgba(255,107,107,.25);color:#ffd0d0;text-decoration:underline wavy}
.tu.t{background:rgba(255,209,102,.15);color:#ffe7a8;opacity:.75} .tu.r{background:rgba(255,255,255,.08);color:#cfd8ef}
.vong{width:96px;height:96px;flex:none}
.loi{border-left:4px solid var(--sai);background:rgba(255,107,107,.1);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.loi.tot{border-color:var(--dung);background:rgba(46,204,113,.1)}
.loi b{display:block;margin-bottom:2px}
.chu-thich{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--chu2);margin-top:6px}
.chu-thich i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.duong{position:relative;padding-left:34px}
.buoc{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;margin:12px 0;cursor:pointer;
  background:var(--kinh);border:1px solid var(--vien);transition:.15s}
.buoc:hover{transform:translateX(3px)}
.buoc .so{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:900;background:#2a3d6b;border:2px solid var(--vien)}
.buoc.xong .so{background:var(--dung);border-color:#a7f3c7}
.duong:before{content:"";position:absolute;left:13px;top:20px;bottom:20px;width:3px;background:linear-gradient(var(--dung),rgba(255,255,255,.15))}
.buoc .bi{font-size:30px;width:44px;text-align:center}
.buoc b{display:block} .buoc span{font-size:13px;color:var(--chu2)}
.vet{display:flex;gap:10px;align-items:flex-start}
.vet svg{width:84px;height:84px;flex:none}
.bong-thoai{position:relative;background:#fff;color:#1a2550;border-radius:16px;padding:12px 14px;font-weight:700;font-size:18px;flex:1}
.bong-thoai:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bong-thoai small{display:block;font-weight:500;color:#5b6890;font-size:13px}
.goi-y{border:1.5px dashed rgba(255,209,102,.6);border-radius:14px;padding:10px 12px;margin:10px 0;color:#ffe7a8;font-size:17px;font-weight:600}
.goi-y small{display:block;color:var(--chu2);font-weight:500;font-size:12px;margin-bottom:3px}
.dong-ho{width:150px;height:150px;margin:0 auto;display:block}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.o-cap{border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;font-size:26px;font-weight:800;border:2px solid var(--vien);
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));transition:.2s}
.o-cap small{display:block;font-size:12px;font-weight:600;color:var(--chu2)}
.o-cap.muc-tieu{border-color:var(--vang);box-shadow:0 0 0 4px rgba(255,209,102,.25)}
.o-cap.dung{border-color:var(--dung);background:rgba(46,204,113,.2)} .o-cap.sai{border-color:var(--sai);background:rgba(255,107,107,.18)}
.thanh{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.thanh i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#34d399,#4f8cff)}
.tien-do-doi .dong{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.tien-do-doi .dong b{width:44px} .tien-do-doi .thanh{flex:1}
.lua{font-size:13px}
#phao{position:fixed;inset:0;pointer-events:none;z-index:30}
.lui{background:none;border:0;color:var(--chu);font-size:26px;cursor:pointer;padding:4px 8px}
.rung{animation:rung .35s} @keyframes rung{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.an{display:none!important}
.the-muc{display:flex;gap:10px}
.the-muc>div{flex:1;text-align:center;padding:12px 6px;border-radius:16px;border:2px solid var(--vien);cursor:pointer;background:var(--kinh)}
.the-muc>div.chon{border-color:var(--vang);background:rgba(255,209,102,.15)}
.the-muc svg{width:46px;height:46px;display:block;margin:0 auto 4px}
.nhan-xet{border-radius:16px;padding:12px;background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,159,67,.08));border:1px solid rgba(255,209,102,.4);margin:8px 0}
.so-to{font-size:30px;font-weight:900}
</style>
</head>

<script>
"use strict";
const ND = {"ghi_chu": "BẢN NHÁP — chị duyệt từng câu. Trọng âm: âm tiết VIẾT HOA là âm nhấn. ngu_dieu: xuong = giọng đi xuống cuối câu, len = đi lên. Sửa câu xong chạy lại: python tao_app.py", "chu_de": [{"id": "ban-than", "ten_vi": "Bản thân", "ten_en": "About me", "hinh": "nguoi", "mau": "#4f8cff", "nhai": [{"en": "My name is Minh.", "vi": "Tôi tên là Minh.", "ngu_dieu": "xuong", "trong_am": [], "am": "237eee9e0f"}, {"en": "I am twenty years old.", "vi": "Tôi hai mươi tuổi.", "ngu_dieu": "xuong", "trong_am": ["TWEN-ty"], "am": "d4a395803f"}, {"en": "I come from Phu Tho province.", "vi": "Tôi đến từ tỉnh Phú Thọ.", "ngu_dieu": "xuong", "trong_am": ["PRO-vince"], "am": "bafba8d0d2"}, {"en": "I am a soldier.", "vi": "Tôi là một quân nhân.", "ngu_dieu": "xuong", "trong_am": ["SOL-dier"], "am": "c82b01da43"}, {"en": "I study at a military school.", "vi": "Tôi học ở một trường quân sự.", "ngu_dieu": "xuong", "trong_am": ["STU-dy", "MI-li-ta-ry"], "am": "761fd338d0"}, {"en": "Where are you from?", "vi": "Bạn đến từ đâu?", "ngu_dieu": "xuong", "trong_am": [], "am": "fe99499473"}, {"en": "Are you a student?", "vi": "Bạn là học viên phải không?", "ngu_dieu": "len", "trong_am": ["STU-dent"], "am": "ef24d6ed91"}], "hoi_dap": [{"hoi": "What's your name?", "vi": "Bạn tên là gì?", "mau": "My name is Minh.", "khung": "My name is ___.", "tu_khoa": ["name"], "can_co": ["name"], "am_hoi": "4a0804b810", "am_mau": "237eee9e0f"}, {"hoi": "How old are you?", "vi": "Bạn bao nhiêu tuổi?", "mau": "I am twenty years old.", "khung": "I am ___ years old.", "tu_khoa": ["years old"], "can_co": ["years", "old"], "am_hoi": "13e575be86", "am_mau": "d4a395803f"}, {"hoi": "Where are you from?", "vi": "Bạn đến từ đâu?", "mau": "I come from Phu Tho province.", "khung": "I come from ___ province.", "tu_khoa": ["come from", "province"], "can_co": ["from"], "am_hoi": "fe99499473", "am_mau": "bafba8d0d2"}, {"hoi": "What do you do?", "vi": "Bạn làm nghề gì?", "mau": "I am a soldier.", "khung": "I am a ___   const c = cd(p.cd), m = c.noi_1_phut;
  ve(dau(`${c.ten_en} · Nói 1 phút`, "chu-de&id=" + c.id) + `
  <div class="vet">${vet(true)}<div class="bong-thoai">${m.de}<small>Nói liền 1 phút theo dàn ý. Bài nói được gửi cho cô nghe và nhận xét.</small></div></div>
  <div class="the"><div id="dh">${dongHo(60, 60)}</div>
  <b>🗺️ Dàn ý</b><div>${m.dan_y.map((d, k) => `<span class="chip">${k + 1}. ${d}</span>`).join("")}</div>
  <b style="display:block;margin-top:8px">💎 Từ vựng — sáng lên khi em dùng</b><div>${m.tu_vung.map(t => `<span class="chip" data-tn="${t}">${t}</span>`).join("")}</div></div>
  ${khuNoi("Bấm micro để bắt đầu 60 giây")}<div id="kq"></div>`);
  if (p.mau) { sangTuNoi(c.noi_cau.mau); $("#dh").innerHTML = dongHo(18, 60); ketQuaMotPhut(c, kqThu(c.noi_cau.mau + " I want to be a good soldier.", p.mau, 52)); }
}
function ketQuaMotPhut(c, kq) {
  const m = c.noi_1_phut, s = " " + chuanHoa(kq.chu).join(" ") + " ", soTu = chuanHoa(kq.chu).length, tpm = kq.giay ? Math.round(soTu * 60 / kq.giay) : 0;
  const tv = m.tu_vung.filter(t => s.includes(" " + chuanHoa(t).join(" ") + " ")), tn = ["and", "but", "because", "so", "then", "first", "after that", "finally", "also"].filter(t => s.includes(" " + chuanHoa(t).join(" ") + " "));
  const diem = Math.min(100, Math.round(Math.min(40, soTu * 0.8) + tv.length / m.tu_vung.length * 35 + Math.min(25, tn.length * 8)));
  sangTuNoi(kq.chu); ting(true); phaoGiay();
  $("#kq").innerHTML = `<div class="the"><div class="hang" style="flex-wrap:nowrap">${vongDiem(diem)}<div><b style="font-size:18px">🎉 Đã gửi bài nói cho cô!</b><div class="mo">Điểm gợi ý của máy — cô sẽ nghe và nhận xét.</div></div></div>
  <div class="hang" style="justify-content:space-around;margin:10px 0;text-align:center">
   <div><div class="so-to">${soTu}</div><span class="mo">từ</span></div><div><div class="so-to">${tpm}</div><span class="mo">từ/phút</span></div>
   <div><div class="so-to">${tv.length}/${m.tu_vung.length}</div><span class="mo">từ vựng</span></div><div><div class="so-to">${tn.length}</div><span class="mo">từ nối</span></div></div>
  ${tpm && tpm < 60 ? `<div class="loi"><b>Nói còn chậm (${tpm} từ/phút)</b><span class="mo">💡 Luyện lại bậc Nối câu cho trôi chảy, mục tiêu 70–100 từ/phút.</span></div>` : ""}
  ${tv.length < m.tu_vung.length / 2 ? `<div class="loi"><b>Dùng thêm từ vựng của chủ đề</b><span class="mo">💡 Chưa dùng: ${m.tu_vung.filter(t => !tv.includes(t)).join(", ")}</span></div>` : `<div class="loi tot"><b>Dùng từ vựng tốt!</b>${tv.join(", ")}</div>`}
  <div class="hang"><button class="nut phu" data-act="noi-lai">🔁 Nói lại</button><button class="nut xanh" data-di="trang-chu">Về trang chủ</button></div></div>`;
  if (!kq.thu) guiLuot({ cd: c.id, bac: "1-phut", i: 0, cau: m.de, diem, loi: [] }, kq);
}

/* ----- Luyện âm theo vùng miền ----- */
function manLuyenAm() {
  const v = S.hv.vung;
  const ds = ND.cap_am.slice().sort((a, b) => (b.vung.includes(v) && b.vung.length < 3) - (a.vung.includes(v) && a.vung.length < 3));
  ve(dau("Luyện âm theo vùng miền", "trang-chu") + `<div class="vet">${vet()}<div class="bong-thoai">Luyện cặp âm dễ nhầm!<small>${v ? "Bài có ★ là lỗi hay gặp ở " + ND.vung_mien[v] + " — tham khảo, em vẫn luyện được mọi bài." : "Chọn một cặp âm để luyện."}</small></div></div>
  <div class="luoi" style="margin-top:12px">${ds.map(a => `<div class="chude" style="min-height:auto" data-di="cap-am&id=${a.id}&i=0">${a.vung.includes(v) && a.vung.length < 3 ? `<div class="vach" style="background:#ffd166"></div>` : ""}
   <b style="font-size:20px">${a.ten}${a.vung.includes(v) && a.vung.length < 3 ? " ★" : ""}</b><i>${a.cap[0].join(" · ")}</i><i style="margin-top:4px">${a.giai_thich}</i></div>`).join("")}</div>`);
}
function manCapAm(p) {
  const a = ND.cap_am.find(x => x.id === p.id), i = +p.i || 0; if (!a || !a.cap[i]) return di("luyen-am");
  const [w1, w2] = a.cap[i], [m1, m2] = a.am[i], mt = p.mt !== undefined ? +p.mt : Math.random() < .5 ? 0 : 1;
  layAm([m1, m2]);
  ve(dau(`${a.ten} · cặp ${i + 1}/${a.cap.length}`, "luyen-am") + `
  <div class="the"><p class="mo" style="margin-top:0">${a.giai_thich}</p><div class="cap">
   <div class="o-cap ${mt === 0 ? "muc-tieu" : ""}" data-act="phat" data-am="${m1}">${w1}<small>🔊 bấm để nghe</small></div>
   <div class="o-cap ${mt === 1 ? "muc-tieu" : ""}" data-act="phat" data-am="${m2}">${w2}<small>🔊 bấm để nghe</small></div></div>
   <div class="goi-y"><small>Mẹo đặt lưỡi, môi</small>${a.meo}</div></div>
  <div class="bong-thoai" style="margin:8px 0 0 10px">Thử thách: hãy nói từ <span style="color:#e67e00">«${[w1, w2][mt]}»</span></div>
  ${khuNoi("Bấm micro và nói đúng một từ")}<div id="kq"></div>`);
  CAP = { a, i, mt, w: [w1, w2] };
  if (p.mau) ketQuaCapAm(kqThu(p.mau === "2" ? [w1, w2][1 - mt] : [w1, w2][mt], p.mau));
}
let CAP = null;
function ketQuaCapAm(kq) {
  const { a, i, mt, w } = CAP, tu = chuanHoa(kq.chu), dich = chuanHoa(w[mt])[0], khac = chuanHoa(w[1 - mt])[0];
  const pa = [kq.chu].concat(...(kq.phuongAn || [])).map(x => chuanHoa(x));
  const dung = pa.some(x => x.includes(dich)), nham = !dung && tu.includes(khac);
  const o = document.querySelectorAll(".o-cap"); o[mt].classList.add(dung ? "dung" : "sai"); if (nham) o[1 - mt].classList.add("sai");
  ting(dung); if (dung) phaoGiay();
  $("#kq").innerHTML = `<div class="the">${dung ? `<div class="loi tot"><b>Chính xác! 🎯</b>Máy nghe đúng «${w[mt]}».</div>`
    : nham ? `<div class="loi"><b>Máy nghe thành «${w[1 - mt]}»</b>Hai âm này em đang nói giống nhau.<br><span class="mo">💡 ${a.meo}</span></div>`
    : `<div class="loi"><b>Máy nghe: «${kq.chu || "…"}»</b><span class="mo">💡 Nói to, rõ một từ. ${a.meo}</span></div>`}
  <div class="hang"><button class="nut phu" data-act="noi-lai">🔁 Thử lại</button><button class="nut xanh" data-di="${i + 1 < a.cap.length ? `cap-am&id=${a.id}&i=${i + 1}` : "luyen-am"}">${i + 1 < a.cap.length ? "Cặp tiếp ➜" : "Xong ✓"}</button></div></div>`;
  if (!kq.thu) guiLuot({ cd: "luyen-am", bac: "cap-am:" + a.id, i, cau: w[mt], diem: dung ? 100 : 0, loi: dung ? [] : [a.id] }, kq);
}

/* ----- Kết quả thử (chế độ chụp, có nhãn DỮ LIỆU THỬ) ----- */
function kqThu(chu, kieu, giay) {
  let c = chu;
  if (kieu === "2") c = chu.replace(/\bthree\b/gi, "tree").replace(/\bparents\b/gi, "parent").replace(/\bstayed\b/gi, "stay").replace(/\bsoldier\b/gi, "solder").replace(/\bstudy\b/gi, "stuff");
  const n = 70, caoDo = Array.from({ length: n }, (_, k) => (k % 17 === 16) ? null : Math.sin(k / 9) * 2.5 + (k > 54 ? (kieu === "2" ? 2 : -1) * (k - 54) / 4 : 0));
  return { chu: c, phuongAn: [], caoDo, giay: giay || 3.2, coSR: true, thu: true };
}

/* ===================== ĐIỀU HƯỚNG ===================== */
function docHash(h) { const [man, ...ts] = String(h || "").replace(/^#/, "").split("&"); const p = {}; ts.forEach(t => { const [k, v] = t.split("="); p[k] = decodeURIComponent(v || ""); }); return { man, p }; }
function di(h) { if (location.hash === "#" + h) hienThi(); else location.hash = h; }
let CHO_MAN = null;
function hienThi() {
  const { man, p } = docHash(location.hash);
  NOI = null; S.chup = S.chup || !!p.mau;
  if (!S.hv && man !== "dang-nhap") return manDangNhap();
  ({ "dang-nhap": manDangNhap, "xep-muc": () => { XM.buoc = +(p.buoc || XM.buoc); manXepMuc(); }, "trang-chu": manTrangChu, "chu-de": manChuDe, "nhai": manNhai, "hoi-dap": manHoiDap,
    "noi-cau": manNoiCau, "noi-1-phut": manMotPhut, "luyen-am": manLuyenAm, "cap-am": manCapAm }[man] || manTrangChu)(p);
  CHO_MAN = { man, p };
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-di],[data-act]"); if (!t) return;
  if (t.dataset.di) return di(t.dataset.di);
  const a = t.dataset.act, { man, p } = CHO_MAN || {};
  if (a === "mo-cua-so") return moCuaSo();
  if (a === "dang-nhap") return dangNhap();
  if (a === "dang-xuat") { S.hv = null; try { sessionStorage.removeItem("speakup_dn"); } catch (er) {} return di("dang-nhap"); }
  if (a === "phat") return phat(t.dataset.am, 1);
  if (a === "phat-cham") return phat(t.dataset.am, 0.7);
  if (a === "noi-lai") { $("#kq").innerHTML = ""; return bamNoi(cauHinhNoi(man, p)); }
  if (a === "xm-vung") { XM.vung = t.dataset.v; XM.buoc = 1; return manXepMuc(); }
  if (a === "xm-tu") { XM.tuDanhGia = +t.dataset.v; XM.buoc = 2; return manXepMuc(); }
  if (a === "noi") return bamNoi(cauHinhNoi(man, p));
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && $("#pin") && document.activeElement && document.activeElement.tagName === "INPUT") dangNhap(); });
function cauHinhNoi(man, p) {
  if (man === "xep-muc") return { toiDa: 20, xong: kq => { XM.soTu += chuanHoa(kq.chu).length; XM.buoc++; if (XM.buoc > 4) ketThucXepMuc(); else manXepMuc(); } };
  if (man === "nhai") return { toiDa: 12, xong: kq => ketQuaNhai(cd(p.cd), +p.i || 0, kq) };
  if (man === "hoi-dap") return { toiDa: 15, xong: kq => ketQuaHoiDap(cd(p.cd), +p.i || 0, kq) };
  if (man === "noi-cau") return { toiDa: 45, lienTuc: true, onChu: sangTuNoi, xong: kq => ketQuaNoiCau(cd(p.cd), kq) };
  if (man === "noi-1-phut") { let bd = 0, h = null; return { toiDa: 60, lienTuc: true, onChu: sangTuNoi,
    batDau: () => { bd = Date.now(); h = setInterval(() => { const con = Math.max(0, 60 - (Date.now() - bd) / 1000); const d = $("#dh"); if (d) d.innerHTML = dongHo(con, 60); if (!con) clearInterval(h); }, 250); },
    xong: kq => { clearInterval(h); ketQuaMotPhut(cd(p.cd), kq); } }; }
  if (man === "cap-am") return { toiDa: 6, xong: kq => ketQuaCapAm(kq) };
  return { xong: () => {} };
}
window.addEventListener("hashchange", hienThi);
(async function batDau() {
  if (!ND) { document.body.innerHTML = "<p style='padding:20px'>Thiếu nội dung bài luyện.</p>"; return; }
  if (CO_MAY_CHU && !MAY_CHU && KHUNG_CHAN_MIC) return manMoCuaSo();
  S.chup = /(^|&)mau=/.test(location.hash) || /chup/.test(location.search);
  if (S.chup) document.documentElement.style.scrollBehavior = "auto";
  let dn = null; try { dn = JSON.parse(sessionStorage.getItem("speakup_dn") || "null"); } catch (e) {}
  if (DEMO && !dn) dn = { ma: "HV07", pin: "1234" };
  if (dn) { try { const r = await goi("dangNhap", dn.ma, dn.pin); if (r.ok) { S.hv = r.hv; S.pin = dn.pin; S.tienDo = r.tienDo; } } catch (e) {} }
  if (/^#?dang-nhap/.test(location.hash)) S.hv = null;
  hienThi();
})();
</script>
